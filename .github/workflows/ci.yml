name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: "true"
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ci-only-dummy-jwt-secret-ci-only-dummy-jwt-secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: "5672"
      RABBITMQ_MANAGEMENT_PORT: "15672"
      RABBITMQ_USER: trybuy_ci
      RABBITMQ_PASS: trybuy_ci_password
      RABBITMQ_VHOST: rabbit-trybuy
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: trybuy_ci
      MYSQL_USER: trybuy_ci
      MYSQL_PASSWORD: trybuy_ci_password
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
      PG_DATABASE: trybuy_ci
      PG_USERNAME: trybuy_ci
      PG_PASSWORD: trybuy_ci_password
      TYPEORM_SYNCHRONIZE: "false"
      TYPEORM_SYNCHRONIZE_ALLOW_PRODUCTION: "false"
      GHN_DEMO_ENDPOINTS_ENABLED: "false"
      GHN_API_URL: https://example.invalid/ghn
      GHN_API_TOKEN: ci_dummy
      GHN_SHOP_ID: "0"
      GHN_WEBHOOK_SECRET: ci_dummy
      CLOUDINARY_CLOUD_NAME: ci_dummy
      CLOUDINARY_API_KEY: ci_dummy
      CLOUDINARY_API_SECRET: ci_dummy
      ZALOPAY_APP_ID: "0"
      ZALOPAY_KEY1: ci_dummy
      ZALOPAY_KEY2: ci_dummy
      ZALOPAY_ENDPOINT: https://example.invalid/zalopay
      ZALOPAY_REDIRECT_URL: http://localhost:3000/api/gateway/payment-result
      VNP_TMN_CODE: ci_dummy
      VNP_HASH_SECRET: ci_dummy
      VNP_URL: https://example.invalid/vnpay
      VNP_RETURN_URL: http://localhost:3000/api/gateway/payment-result
      VNPAY_IPN_URL: http://localhost:3000/vnpay/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace in committed diff
        shell: bash
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event.before }}" != "$zero_sha" ]]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff --check HEAD
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check "apps/**/*.ts" "libs/**/*.ts"

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npx tsc --noEmit

      # Project invariants eslint cannot express (TCP client resilience,
      # message-pattern shape agreement, RPC exception filters). Each one was
      # prose in ai-docs/agent-context/conventions.md and each cost a real
      # 500/502 before it was mechanized.
      - name: Check project conventions
        run: npm run check:conventions

      # The prod DDNS host must never enter the repo — it points a reader
      # straight at the live box. The value is compared from the secret, so it
      # is never written down here, and only file names are printed on failure
      # (a matched LINE would echo the host into a public log).
      - name: Guard against committed production hostname
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          host="${EC2_HOST:-}"
          host="${host,,}"
          # Fork PRs get no secrets — nothing to compare against, so pass.
          if [[ -z "$host" ]]; then
            echo "EC2_HOST secret unavailable (fork PR?) — skipping hostname guard."
            exit 0
          fi
          needles=("$host")
          # Also catch the bare registrable domain: a stray `example.com` in a
          # comment is the leak a search for the full hostname misses.
          if [[ "$host" =~ ^[a-z0-9.-]+\.[a-z]{2,}$ && ! "$host" =~ ^[0-9.]+$ ]]; then
            needles+=("$(awk -F. '{ print $(NF-1) "." $NF }' <<<"$host")")
          fi
          status=0
          for needle in "${needles[@]}"; do
            # A blank needle would match every file in the repo.
            if [[ -z "$needle" ]]; then
              continue
            fi
            if matches=$(git grep -ril --fixed-strings -- "$needle" 2>/dev/null); then
              echo "::error::Production hostname (or its registrable domain) is committed. Replace it with the placeholder <PROD_API_DOMAIN>."
              echo "Offending files:"
              echo "$matches"
              status=1
            fi
          done
          exit $status

      - name: Unit tests
        run: npm test -- --runInBand --passWithNoTests

      - name: Build
        run: npm run build

      # Keeps the exact bits CI validated, so a future build-on-runner deploy
      # (CD-03) can ship them instead of rebuilding on the box.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Validate PM2 ecosystem config syntax
        run: node -c ecosystem.config.js

      - name: Validate Docker Compose config
        run: docker compose config

      # Dependency audit runs last so a newly published advisory never hides the
      # lint/test/build result. Only production dependencies block: dev/build-tool
      # advisories (the @nestjs/cli -> @swc/cli -> @xhmikosr chain) are reported
      # but must not turn an unrelated PR red.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high
