approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
personality = "pragmatic"

[features]
hooks = true
multi_agent = true

[agents]
max_threads = 6
max_depth = 1

[mcp_servers.postman]
command = "npx"
args = ["-y", "@postman/postman-mcp-server@latest", "--full"]
startup_timeout_sec = 120
