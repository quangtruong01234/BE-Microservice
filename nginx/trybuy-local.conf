# Local mirror of trybuy.conf (no TLS, gateway via host.docker.internal).
# Run: docker run --rm -p 8088:80 -v "$PWD/nginx/trybuy-local.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
# Then hit http://localhost:8088 — X-Cache-Status header shows MISS/HIT on catalog GETs.

limit_req_zone $binary_remote_addr zone=trybuy_api_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=trybuy_conn:10m;
proxy_cache_path /var/cache/nginx/trybuy levels=1:2 keys_zone=trybuy_micro:10m
                 max_size=100m inactive=60s use_temp_path=off;

upstream trybuy_gateway {
    server host.docker.internal:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript;

    limit_conn trybuy_conn 32;
    limit_req_status 429;
    limit_conn_status 429;

    location /zalopay/callback {
        client_max_body_size 64k;
        proxy_pass http://trybuy_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vnpay/callback {
        client_max_body_size 64k;
        proxy_pass http://trybuy_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://trybuy_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/api/products(/(prod_[A-Za-z0-9]+|brands|categories))?$ {
        limit_req zone=trybuy_api_req burst=60 nodelay;

        proxy_cache trybuy_micro;
        proxy_cache_valid 200 5s;
        proxy_cache_key "$request_method$host$uri$is_args$args";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://trybuy_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=trybuy_api_req burst=60 nodelay;

        proxy_pass http://trybuy_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
