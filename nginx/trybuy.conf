# Deploy steps:
# 1. sudo apt install nginx certbot python3-certbot-nginx
# 2. Thay yourdomain.com bằng domain thật
# 3. sudo mkdir -p /var/cache/nginx/trybuy && sudo chown www-data:www-data /var/cache/nginx/trybuy
# 4. sudo cp nginx/trybuy.conf /etc/nginx/sites-available/trybuy
# 5. sudo ln -s /etc/nginx/sites-available/trybuy /etc/nginx/sites-enabled/
# 6. sudo certbot --nginx -d yourdomain.com
# 7. sudo nginx -t && sudo systemctl reload nginx
#
# Load-absorption layer (SCALE-03):
# - limit_req 30r/s per IP (burst 60) on API locations; payment/GHN callbacks and
#   /socket.io/ are exempt (providers retry, sockets are long-lived).
# - Upstream keepalive 32 — reuses connections to Node instead of one per request.
# - gzip for JSON responses (no Node compression middleware needed).
# - 5s proxy micro-cache ONLY on the four @Public user-invariant catalog GETs
#   (product list, product detail prod_*, brands, categories) with
#   proxy_cache_lock as a stampede guard. Never widen the regex to authenticated
#   routes — nginx would serve one user's cached response to everyone.
# Tune rate=30r/s / burst=60 upward if the FE's normal fan-out ever trips 429s.

# http-context directives (sites-enabled files are included inside http{}).
limit_req_zone $binary_remote_addr zone=trybuy_api_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=trybuy_conn:10m;
proxy_cache_path /var/cache/nginx/trybuy levels=1:2 keys_zone=trybuy_micro:10m
                 max_size=100m inactive=60s use_temp_path=off;

upstream trybuy_gateway {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript;

    limit_conn trybuy_conn 32;
    limit_req_status 429;
    limit_conn_status 429;

    # Payment provider callbacks — no limit_req (providers retry on failure).
    location /zalopay/callback {
        client_max_body_size 64k;
        proxy_pass http://trybuy_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vnpay/callback {
        client_max_body_size 64k;
        proxy_pass http://trybuy_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://trybuy_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Micro-cache: @Public user-invariant catalog reads only.
    # Matches GET /api/products, /api/products/prod_<id>, /api/products/brands,
    # /api/products/categories. POSTs to the same paths pass through uncached
    # (proxy_cache only stores GET/HEAD); responses with Set-Cookie are never cached.
    location ~ ^/api/products(/(prod_[A-Za-z0-9]+|brands|categories))?$ {
        limit_req zone=trybuy_api_req burst=60 nodelay;

        proxy_cache trybuy_micro;
        proxy_cache_valid 200 5s;
        proxy_cache_key "$request_method$host$uri$is_args$args";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://trybuy_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=trybuy_api_req burst=60 nodelay;

        proxy_pass http://trybuy_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
